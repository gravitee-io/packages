server {
	listen  0.0.0.0:8086;

    # The Management API URL below must match "gammaBaseURL" in /opt/graviteeio/apim/gamma-ui/constants.json:
    # if you expose the Management API on another URL, change it in both files and reload nginx.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-eval' 'unsafe-inline' http://localhost:8083/gamma http://localhost:8083/gamma/; object-src 'none'; frame-ancestors 'self'; style-src 'self' 'unsafe-inline' http://localhost:8083/gamma http://localhost:8083/gamma/; img-src 'self' data: https: http:; connect-src http: https:; base-uri 'self'; form-action 'self'; font-src 'self' http://localhost:8083/gamma http://localhost:8083/gamma/;" always;
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options nosniff;
    add_header X-Permitted-Cross-Domain-Policies none;

    index index.html index.htm;
    charset utf-8;

    gzip on;
    gzip_disable "msie6";

    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript application/javascript;

    location / {
        try_files $uri $uri/ =404;
        error_page 404 /;
        root /opt/graviteeio/apim/gamma-ui;
        sub_filter '<base href="/"' '<base href="/"';
        sub_filter_once on;
    }

    # redirect server error pages to the static page /50x.html
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /opt/graviteeio/apim/gamma-ui;
    }
}
